# ───────────────────────────────────────────────────────────────────────────
#  CALENDRIER PROPRE DE L'ORDRE DES PRÊCHEURS
#  Calendarium Ordinis Prædicatorum, approuvé le 14 avril 2019 (prot. 188/19),
#  en vigueur depuis le 1er dimanche de l'Avent 2019.
#
#  Chaque célébration : date = "mois-jour", nom, rang.
#  Rangs : "solennité", "fête", "mémoire", "mémoire facultative", "anniversaire".
#  couleur (facultatif) : "Rouge" pour les martyrs ; sinon blanc.
#
#  Les célébrations entre crochets dans le Calendarium (reprises du calendrier
#  romain avec des textes propres : Présentation, Annonciation, Assomption,
#  Toussaint…) ne sont pas répétées ici : l'AELF les donne déjà.
#  Le 22 octobre (Dédicace, dans les églises dont on ignore la date) n'est pas
#  inscrit : il ne concerne que certaines églises.
#
#  La règle de préséance appliquée : une célébration de l'Ordre remplace le jour
#  romain quand son rang est au moins égal (une fête de l'Ordre ne remplace pas
#  un dimanche ; une mémoire ne remplace pas une fête). En Carême, du 17 au 24
#  décembre et dans l'octave de Noël, une mémoire devient facultative.
# ───────────────────────────────────────────────────────────────────────────

